name: Build
run-name: Build (Linux/Windows/Android)

# Runs on every push and can also be triggered manually from the Actions
# tab. Builds all three supported platforms and uploads each as a
# downloadable workflow artifact. Windows and Linux desktop builds can't be
# cross-compiled from one host, so each platform gets its own
# appropriately-hosted runner.
#
# Pushing a tag matching v* (e.g. `git tag v1.0.0 && git push --tags`)
# additionally packages each platform's build into a zip and publishes them
# on a GitHub Release for that tag — a stable, permanent download location
# with no login required and no 90-day artifact expiry, unlike the
# per-workflow-run artifacts above.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed by the release job to create/attach to a GitHub Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build linux
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/remote_helm-linux.zip" .

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-linux
          path: remote_helm-linux.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath remote_helm-windows.zip

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-windows
          path: remote_helm-windows.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Copy for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/app/outputs/flutter-apk/app-release.apk remote_helm-android.apk

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-android
          path: remote_helm-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
