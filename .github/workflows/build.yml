name: Build

# Runs on every push and can also be triggered manually from the Actions
# tab. Builds all three supported platforms and uploads each as a
# downloadable workflow artifact. Windows and Linux desktop builds can't be
# cross-compiled from one host, so each platform gets its own
# appropriately-hosted runner.
on:
  push:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build linux
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: remote_helm-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
